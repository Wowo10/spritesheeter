<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ssheet - RTS sprite generator</title>
    <meta name="kofi" content="__KOFI_ACCOUNT__" />
    <meta name="github" content="__GITHUB_ACCOUNT__" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=__G_ANA_SECRET__"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '__G_ANA_SECRET__');
    </script>
  </head>
  <body>
    <div id="app">
      <section id="view3d"></section>
      <div id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>
      <section id="side">
        <div class="panel">
          <h2>Sprite <span id="animLabel"></span></h2>
          <canvas id="compass"></canvas>
        </div>
        <div class="panel">
          <h2>Portrait <span id="portraitInfo"></span></h2>
          <canvas id="portrait"></canvas>
        </div>
        <div class="panel">
          <h2>Sheet <span id="sheetInfo"></span></h2>
          <div class="sheetWrap"><canvas id="sheet"></canvas></div>
        </div>
        <div class="panel">
          <h2>Effects <span id="effectsInfo"></span></h2>
          <div class="sheetWrap"><canvas id="effects"></canvas></div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
